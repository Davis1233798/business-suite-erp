name: ERP validation and container publication
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  windows-desktop:
    needs: erp
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - name: Check ERP desktop identity and data boundaries
        run: node --test tests/desktop-identity.test.cjs
      - name: Build Windows ERP desktop backend and assets
        run: npm run desktop:prepare
      - name: Package unpacked Windows ERP desktop app
        run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: forgeflow-erp-windows-${{ github.sha }}
          path: outputs/desktop/win-unpacked/
          if-no-files-found: error
          retention-days: 7

  erp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - name: Check release workflow build boundary
        run: node --test tests/erp-workflow-contract.test.cjs
      - name: Verify the pinned ERP OCI release contract
        run: python3 -m unittest discover -s infra/tests -p test_erp_image_release.py
      - run: npx tsc --noEmit
      - run: npm test
      - run: go -C backend test -race -timeout=20m ./...
      - run: npm run web:build
      - name: Build ERP image
        run: docker build -f infra/linux/Dockerfile.station -t erp-ci:${GITHUB_SHA} .
      - name: Smoke-test isolated ERP image
        run: |
          set -euo pipefail
          docker run -d --name erp-ci -p 127.0.0.1:18095:8095 erp-ci:${GITHUB_SHA}
          trap 'docker logs erp-ci; docker rm -f erp-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/mes/login)" = 404
      - name: Install Chromium for real journal acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify browser journal posting against the Go image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name erp-browser -p 127.0.0.1:18095:8095 erp-ci:${GITHUB_SHA}
          trap 'docker logs erp-browser; docker rm -f erp-browser' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null
          npx playwright test --config playwright.erp.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  release:
    needs: [erp, windows-desktop]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            suffix: ''
          - runner: ubuntu-24.04-arm
            architecture: arm64
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run install:ci
      - name: Build ERP web assets for the isolated release workspace
        run: npm run web:build
      - name: Build ERP image after all platform checks
        run: docker build -f infra/linux/Dockerfile.station --build-arg SUITE_RELEASE_SHA="${GITHUB_SHA}" -t erp-ci:${GITHUB_SHA} .
      - name: Verify ERP release image and revision
        env:
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: bash infra/linux/smoke-erp-release-image.sh "erp-ci:${GITHUB_SHA}" "$IMAGE_ARCHITECTURE" "$GITHUB_SHA"
      - name: Verify persisted ERP state across ARM64 container replacement
        if: matrix.architecture == 'arm64'
        run: python3 infra/tests/smoke_erp_image_persistence.py "erp-ci:${GITHUB_SHA}" "$GITHUB_SHA"
      - name: Verify main head before image publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha | grep -Fx "$GITHUB_SHA"
      - name: Publish ERP image after all platform checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-erp-station"
          tag="${GITHUB_SHA}${IMAGE_TAG_SUFFIX}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag erp-ci:${GITHUB_SHA} "$image:$tag"
          docker push "$image:$tag"
